[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-bound-force"
version = "0.1.0"
description = "Dual-bound robust streaming correlation sketching"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "numba>=0.65"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/pz1004/dual-bound-force"

[project.optional-dependencies]
test = ["pytest>=8", "scikit-learn>=1.4", "psutil>=5.9"]
paper = ["matplotlib>=3.8"]

[project.scripts]
dual-bound-force-study = "dual_bound_force.experiments.cli:main"
dual-bound-force-audit = "dual_bound_force.experiments.audit_cli:main"
dual-bound-force-external = "dual_bound_force.experiments.external_cli:main"
dual-bound-force-timing = "dual_bound_force.experiments.timing_cli:main"
dual-bound-force-structural-ceiling = "dual_bound_force.experiments.structural_ceiling_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_bound_force = ["experiments/baseline_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--capture=no"
markers = ["slow: full confirmatory experiment", "network: requires external data"]
